function parseRows(cols, text) {
  return text.trim().split('\n').map(line => {
    const parts = line.split('|');

      let v = parts[i] === undefined ? '' : parts[i].trim();
      if (v === '') row[c.name] = null;
      else row[c.name] = c.type === 'number' ? Number(v) : v;
    });
    return row;
  });
}

/* ---------- Mini SQL engine (SELECT / FROM / WHERE / ORDER BY / LIMIT) ---------- */
const RESERVED = new Set(['SELECT', 'FROM', 'WHERE', 'ORDER', 'BY', 'LIMIT', 'AND', 'OR', 'NOT', 'BETWEEN', 'IN', 'LIKE', 'ILIKE', 'IS', 'NULL', 'TRUE', 'FALSE', 'AS', 'ASC', 'DESC']);
class SqlError extends Error {}
const fail = m => { throw new SqlError(m); };

function tokenize(sql) {
  sql = sql.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"');
  const toks = []; const n = sql.length; let i = 0;
  while (i < n) {
    const c = sql[i];
    if (/\s/.test(c)) { i++; continue; }
    if (c === '-' && sql[i + 1] === '-') { while (i < n && sql[i] !== '\n') i++; continue; }
    if (c === "'") {
      let j = i + 1, s = '';
      for (;;) {
        if (j >= n) fail("A text value is missing its closing quote. Every string needs a quote on both sides, like 'UAE'.");
        if (sql[j] === "'") { if (sql[j + 1] === "'") { s += "'"; j += 2; continue; } break; }
        s += sql[j++];
      }
      toks.push({ t: 'str', v: s }); i = j + 1; continue;
    }
    if (c === '"') {
      const j = sql.indexOf('"', i + 1);
      if (j < 0) fail('A double-quoted name is missing its closing quote.');
      toks.push({ t: 'id', v: sql.slice(i + 1, j), q: true }); i = j + 1; continue;
    }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(sql[i + 1] || ''))) {
      let j = i; while (j < n && /[0-9.]/.test(sql[j])) j++;
      toks.push({ t: 'num', v: Number(sql.slice(i, j)) }); i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i; while (j < n && /[A-Za-z0-9_$]/.test(sql[j])) j++;
      toks.push({ t: 'id', v: sql.slice(i, j) }); i = j; continue;
    }
    const two = sql.substr(i, 2);
    if (['<=', '>=', '<>', '!='].includes(two)) { toks.push({ t: 'op', v: two }); i += 2; continue; }
    if ('=<>(),*;-'.includes(c)) { toks.push({ t: 'op', v: c }); i++; continue; }
    fail(`Unexpected character "${c}".`);
  }
  return toks;
}

function parseSql(sql) {
  const toks = tokenize(sql); let p = 0;
  const isKw = k => { const t = toks[p]; return t && t.t === 'id' && !t.q && t.v.toUpperCase() === k; };
  const isOp = o => { const t = toks[p]; return t && t.t === 'op' && t.v === o; };
  const show = () => !toks[p] ? 'the end of the query' : toks[p].t === 'str' ? `'${toks[p].v}'` : String(toks[p].v);
  const expectKw = (k, hint) => { if (!isKw(k)) fail(`Expected ${k} but found ${show()}.${hint ? ' ' + hint : ''}`); p++; };

  function parseOr() { const items = [parseAnd()]; while (isKw('OR')) { p++; items.push(parseAnd()); } return items.length > 1 ? { k: 'or', items } : items[0]; }
  function parseAnd() { const items = [parseNot()]; while (isKw('AND')) { p++; items.push(parseNot()); } return items.length > 1 ? { k: 'and', items } : items[0]; }
  function parseNot() { if (isKw('NOT')) { p++; return { k: 'not', e: parseNot() }; } return parsePred(); }
  function parsePred() {
    const l = parsePrimary();
    const t = toks[p];
    if (t && t.t === 'op' && ['=', '<>', '!=', '<', '>', '<=', '>='].includes(t.v)) {
      p++; const r = parsePrimary();
      return { k: 'cmp', op: t.v === '!=' ? '<>' : t.v, l, r };
    }
    let neg = false;
    if (isKw('NOT')) {
      const nx = toks[p + 1];
      if (nx && nx.t === 'id' && ['BETWEEN', 'IN', 'LIKE', 'ILIKE'].includes(nx.v.toUpperCase())) { neg = true; p++; }
    }
    if (isKw('BETWEEN')) {
      p++; const lo = parsePrimary();
      if (!isKw('AND')) fail(`BETWEEN needs the form BETWEEN low AND high, but found ${show()} after the low value.`);
      p++; const hi = parsePrimary();
      return { k: 'between', neg, e: l, lo, hi };
    }
    if (isKw('IN')) {
      p++;
      if (!isOp('(')) fail("IN needs a list in brackets, like IN ('UAE', 'Qatar').");
      p++; const list = [parsePrimary()];
      while (isOp(',')) { p++; list.push(parsePrimary()); }
      if (!isOp(')')) fail('The IN list is missing its closing bracket, or a comma between values.');
      p++;
      return { k: 'in', neg, e: l, list };
    }
    if (isKw('LIKE') || isKw('ILIKE')) {
      const ci = isKw('ILIKE'); p++;
      const pat = parsePrimary();
      return { k: 'like', neg, ci, e: l, pat };
    }
    if (isKw('IS')) {
      p++; let n = false;
      if (isKw('NOT')) { p++; n = true; }
      if (!isKw('NULL')) fail('After IS, write NULL or NOT NULL.');
      p++;
      return { k: 'isnull', neg: n, e: l };
    }
    return l;
  }
  function parsePrimary() {
    const t = toks[p];
    if (!t) fail('The query ended early. Something is missing after the last keyword or operator.');
    if (t.t === 'op' && t.v === '(') {
      p++; const e = parseOr();
      if (!isOp(')')) fail('A bracket was opened but never closed. Add the missing ")".');
      p++; return Object.assign({}, e, { paren: true });
    }
    if (t.t === 'op' && t.v === '-') {
      p++; const nx = toks[p];
      if (!nx || nx.t !== 'num') fail('A minus sign must be followed by a number.');
      p++; return { k: 'lit', v: -nx.v };
    }
    if (t.t === 'num') { p++; return { k: 'lit', v: t.v }; }
    if (t.t === 'str') { p++; return { k: 'lit', v: t.v }; }
    if (t.t === 'id') {
      const u = t.v.toUpperCase();
      if (!t.q) {
        if (u === 'NULL') { p++; return { k: 'lit', v: null }; }
        if (u === 'TRUE') { p++; return { k: 'lit', v: true }; }
        if (u === 'FALSE') { p++; return { k: 'lit', v: false }; }
        if (RESERVED.has(u)) fail(`Unexpected ${t.v}. A column name or a value was expected here.`);
        const nx = toks[p + 1];
        if (nx && nx.t === 'op' && nx.v === '(') fail(`Functions like ${t.v}(...) aren't supported in this practice tool yet. Stick to columns and values.`);
      }
      p++; return { k: 'col', name: t.v };
    }
    fail(`Unexpected ${show()}.`);
  }

  expectKw('SELECT', 'Every query starts with SELECT.');
  let cols;
  if (isOp('*')) { p++; cols = '*'; }
  else {
    cols = [];
    for (;;) {
      if (cols.length && isKw('FROM')) fail('There is an extra comma before FROM.');
      const t = toks[p];
      if (!t || t.t !== 'id' || (!t.q && RESERVED.has(t.v.toUpperCase()))) fail(`Expected a column name in the SELECT list but found ${show()}.`);
      const nx = toks[p + 1];
      if (nx && nx.t === 'op' && nx.v === '(') fail(`Functions like ${t.v}(...) aren't supported in this practice tool yet. Select plain columns.`);
      p++;
      let alias = null;
      if (isKw('AS')) { p++; const a = toks[p]; if (!a || a.t !== 'id') fail('Expected a name after AS.'); alias = a.v; p++; }
      cols.push({ name: t.v, alias });
      if (isOp(',')) { p++; continue; }
      break;
    }
  }
  expectKw('FROM', 'Did you forget a comma between two columns?');
  const tt = toks[p];
  if (!tt || tt.t !== 'id') fail('Expected a table name after FROM.');
  p++;
  const table = tt.v;
  let where = null, order = [], limit = null, last = 'from';
  if (isKw('WHERE')) { p++; where = parseOr(); last = 'where'; }
  if (isKw('ORDER')) {
    p++; expectKw('BY');
    for (;;) {
      const t = toks[p];
      if (!t || t.t !== 'id') fail('Expected a column name after ORDER BY.');
      p++;
      let dir = 'ASC';
      if (isKw('ASC')) p++; else if (isKw('DESC')) { dir = 'DESC'; p++; }
      order.push({ name: t.v, dir });
      if (isOp(',')) { p++; continue; }
      break;
    }
    last = 'order';
  }
  if (isKw('LIMIT')) {
    p++; const t = toks[p];
    if (!t || t.t !== 'num' || !Number.isInteger(t.v) || t.v < 0) fail('LIMIT must be followed by a whole number, like LIMIT 5.');
    p++; limit = t.v; last = 'limit';
  }
  if (isOp(';')) p++;
  if (p < toks.length) {
    fail(`Unexpected ${show()}. ` + (last === 'where' ? 'Conditions need AND or OR between them.' : 'Keep the clause order: SELECT, FROM, WHERE, ORDER BY, LIMIT.'));
  }
  return { cols, table, where, order, limit };
}

/* --- evaluation with three-valued logic --- */
function cmpVals(a, b) {
  if (typeof a === 'number' && typeof b === 'number') return a - b;
  if (typeof a === 'number' && typeof b === 'string' && b.trim() !== '' && !isNaN(Number(b))) return a - Number(b);
  if (typeof b === 'number' && typeof a === 'string' && a.trim() !== '' && !isNaN(Number(a))) return Number(a) - b;
  const x = String(a), y = String(b);
  return x < y ? -1 : x > y ? 1 : 0;
}
function like(val, pat, ci) {
  let re = '';
  for (const ch of String(pat)) {
    if (ch === '%') re += '[\\s\\S]*';
    else if (ch === '_') re += '[\\s\\S]';
    else re += ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }
  return new RegExp('^' + re + '$', ci ? 'i' : '').test(String(val));
}
const and3 = (a, b) => (a === false || b === false) ? false : (a === null || b === null) ? null : true;
const not3 = a => a === null ? null : !a;
function asBool(v) {
  if (v === null || typeof v === 'boolean') return v;
  fail('WHERE needs a true/false condition, like nights > 3. A plain column or value is not a condition.');
}
function ev(n, row) {
  switch (n.k) {
    case 'lit': return n.v;
    case 'col': { const v = row[n.name.toLowerCase()]; return v === undefined ? null : v; }
    case 'and': { let r = true; for (const it of n.items) { const v = asBool(ev(it, row)); if (v === false) return false; if (v === null) r = null; } return r; }
    case 'or': { let r = false; for (const it of n.items) { const v = asBool(ev(it, row)); if (v === true) return true; if (v === null) r = null; } return r; }
    case 'not': return not3(asBool(ev(n.e, row)));
    case 'cmp': {
      const a = ev(n.l, row), b = ev(n.r, row);
      if (a === null || b === null) return null;
      const c = cmpVals(a, b);
      return { '=': c === 0, '<>': c !== 0, '<': c < 0, '>': c > 0, '<=': c <= 0, '>=': c >= 0 }[n.op];
    }
    case 'between': {
      const x = ev(n.e, row), lo = ev(n.lo, row), hi = ev(n.hi, row);
      const ge = (x === null || lo === null) ? null : cmpVals(x, lo) >= 0;
      const le = (x === null || hi === null) ? null : cmpVals(x, hi) <= 0;
      const r = and3(ge, le);
      return n.neg ? not3(r) : r;
    }
    case 'in': {
      const x = ev(n.e, row);
      if (x === null) return null;
      let sawNull = false, hit = false;
      for (const it of n.list) { const v = ev(it, row); if (v === null) sawNull = true; else if (cmpVals(x, v) === 0) { hit = true; break; } }
      const r = hit ? true : sawNull ? null : false;
      return n.neg ? not3(r) : r;
    }
    case 'like': {
      const x = ev(n.e, row), pt = ev(n.pat, row);
      if (x === null || pt === null) return null;
      const r = like(x, pt, n.ci);
      return n.neg ? !r : r;
    }
    case 'isnull': { const x = ev(n.e, row); const r = x === null; return n.neg ? !r : r; }
  }
  fail('Unsupported expression.');
}

/* --- helpers for display --- */
function fmt(n, top) {
  const q = v => v === null ? 'NULL' : typeof v === 'string' ? "'" + v.replace(/'/g, "''") + "'" : String(v);
  switch (n.k) {
    case 'lit': return q(n.v);
    case 'col': return n.name.toLowerCase();
    case 'cmp': return `${fmt(n.l)} ${n.op} ${fmt(n.r)}`;
    case 'between': return `${fmt(n.e)} ${n.neg ? 'NOT ' : ''}BETWEEN ${fmt(n.lo)} AND ${fmt(n.hi)}`;
    case 'in': return `${fmt(n.e)} ${n.neg ? 'NOT ' : ''}IN (${n.list.map(x => fmt(x)).join(', ')})`;
    case 'like': return `${fmt(n.e)} ${n.neg ? 'NOT ' : ''}${n.ci ? 'ILIKE' : 'LIKE'} ${fmt(n.pat)}`;
    case 'isnull': return `${fmt(n.e)} IS ${n.neg ? 'NOT ' : ''}NULL`;
    case 'not': return `NOT ${fmt(n.e)}`;
    case 'and': case 'or': {
      const s = n.items.map(x => fmt(x)).join(n.k === 'and' ? ' AND ' : ' OR ');
      return top ? s : '(' + s + ')';
    }
  }
}
function treeLines(n, prefix, isLast, isRoot) {
  const label = n.k === 'and' ? 'AND' : n.k === 'or' ? 'OR' : n.k === 'not' ? 'NOT' : fmt(n, true);
  const out = [{ prefix: isRoot ? '' : prefix + (isLast ? '\u2514\u2500 ' : '\u251C\u2500 '), label, op: ['and', 'or', 'not'].includes(n.k) }];
  const kids = (n.k === 'and' || n.k === 'or') ? n.items : n.k === 'not' ? [n.e] : [];
  const np = isRoot ? '' : prefix + (isLast ? '   ' : '\u2502  ');
  kids.forEach((c, i) => out.push(...treeLines(c, np, i === kids.length - 1, false)));
  return out;
}
function leaves(n) {
  if (n.k === 'and' || n.k === 'or') return n.items.flatMap(leaves);
  if (n.k === 'not') return leaves(n.e);
  return [n];
}
function colsIn(n, set) {
  if (n.k === 'col') set.add(n.name.toLowerCase());
  else if (n.k === 'and' || n.k === 'or') n.items.forEach(x => colsIn(x, set));
  else if (n.k === 'not' || n.k === 'isnull') colsIn(n.e, set);
  else if (n.k === 'cmp') { colsIn(n.l, set); colsIn(n.r, set); }
  else if (n.k === 'between') { colsIn(n.e, set); colsIn(n.lo, set); colsIn(n.hi, set); }
  else if (n.k === 'in') { colsIn(n.e, set); n.list.forEach(x => colsIn(x, set)); }
  else if (n.k === 'like') { colsIn(n.e, set); colsIn(n.pat, set); }
  return set;
}
function relyOnPrecedence(n) {
  if (!n) return false;
  if (n.k === 'or') return n.items.some(x => (x.k === 'and' && !x.paren) || relyOnPrecedence(x));
  if (n.k === 'and') return n.items.some(relyOnPrecedence);
  if (n.k === 'not') return relyOnPrecedence(n.e);
  return false;
}

function runQuery(sql) {
  if (!sql.trim()) fail('Type a query first.');
  const q = parseSql(sql);
  const tbl = TABLES[q.table.toLowerCase()];
  if (!tbl) fail(`Table "${q.table}" doesn't exist here. Available tables: ${Object.keys(TABLES).join(', ')}.`);
  const known = new Set(tbl.cols.map(c => c.name));
  const check = name => { if (!known.has(name.toLowerCase())) fail(`Column "${name}" doesn't exist in ${tbl.name}. Available columns: ${tbl.cols.map(c => c.name).join(', ')}.`); };
  if (q.cols !== '*') q.cols.forEach(c => check(c.name));
  if (q.where) colsIn(q.where, new Set()).forEach(check);
  q.order.forEach(o => check(o.name));

  let kept = tbl.rows;
  let verdicts = null;
  if (q.where) {
    verdicts = tbl.rows.map(r => asBool(ev(q.where, r)));
    kept = tbl.rows.filter((r, i) => verdicts[i] === true);
  }
  const afterWhere = kept.length;
  if (q.order.length) {
    kept = kept.slice().sort((a, b) => {
      for (const o of q.order) {
        const k = o.name.toLowerCase(); const x = a[k], y = b[k];
        let c;
        if (x === null && y === null) c = 0; else if (x === null) c = 1; else if (y === null) c = -1; else c = cmpVals(x, y);
        if (c !== 0) return o.dir === 'DESC' ? -c : c;
      }
      return 0;
    });
  }
  if (q.limit !== null) kept = kept.slice(0, q.limit);
  const outCols = q.cols === '*' ? tbl.cols.map(c => c.name) : q.cols.map(c => c.alias || tbl.cols.find(x => x.name === c.name.toLowerCase()).name);
  const keys = q.cols === '*' ? tbl.cols.map(c => c.name) : q.cols.map(c => c.name.toLowerCase());
  const rows = kept.map(r => keys.map(k => r[k]));
  return { q, tbl, cols: outCols, rows, afterWhere, total: tbl.rows.length, verdicts };
}

function traceFor(res) {
  const { q, tbl } = res;
  if (!q.where) return null;
  const lv = leaves(q.where);
  const refd = Array.from(colsIn(q.where, new Set())).slice(0, 4);
  const idCol = tbl.cols[0].name;
  const showCols = [idCol].concat(refd.filter(c => c !== idCol));
  const useLeaves = lv.length <= 6 && !(lv.length === 1 && q.where.k !== 'not');
  const rows = tbl.rows.map((r, i) => ({
    vals: showCols.map(c => r[c]),
    leaf: useLeaves ? lv.map(l => ev(l, r)) : [],
    final: res.verdicts[i]
  }));
  return { showCols, leafLabels: useLeaves ? lv.map(l => fmt(l, true)) : [], rows };
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function cell(v) {
  if (v === null) return '<td><span class="null">NULL</span></td>';
  if (typeof v === 'number') return `<td class="num">${v}</td>`;
  return `<td>${esc(v)}</td>`;
}
function renderTable(cols, rows) {
  if (!rows.length) return '<div class="empty">0 rows returned. Nothing matched the WHERE condition.</div>';
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(cell).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const vchip = v => v === true ? '<span class="v T">TRUE</span>' : v === false ? '<span class="v F">FALSE</span>' : '<span class="v N">NULL</span>';

function renderReads(res) {
  const w = res.q.where;
  if (!w) return '';
  const lines = treeLines(w, '', true, true).map(l =>
    esc(l.prefix) + (l.op ? `<span class="op">${l.label}</span>` : esc(l.label))).join('\n');
  const warn = relyOnPrecedence(w)
    ? '<div class="warn">This mixes AND with OR without brackets, so SQL groups the AND parts first. Check that the tree below is what you meant.</div>' : '';
  return `<div class="reads"><h3>How SQL reads your WHERE</h3><div class="line">${esc(fmt(w, false))}</div><pre>${lines}</pre>${warn}</div>`;
}
function renderTrace(res) {
  const t = traceFor(res);
  if (!t) return '<div class="empty">This query has no WHERE, so every row is returned.</div>';
  const head = t.showCols.map(c => `<th>${esc(c)}</th>`).join('') + t.leafLabels.map(l => `<th>${esc(l)}</th>`).join('') + '<th>WHERE result</th>';
  const body = t.rows.map(r => {
    const kept = r.final === true;
    return `<tr class="${kept ? 'kept' : 'dim'}">${r.vals.map(v => v === null ? '<td><span class="null">NULL</span></td>' : `<td class="val${typeof v === 'number' ? ' num' : ''}">${esc(v)}</td>`).join('')}${r.leaf.map(v => `<td>${vchip(v)}</td>`).join('')}<td>${vchip(r.final)}</td></tr>`;
  }).join('');
  return `<div class="legend"><span class="v T">TRUE</span>row is kept &nbsp; <span class="v F">FALSE</span>row is removed &nbsp; <span class="v N">NULL</span>unknown, so the row is removed too</div><div class="tw"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

  let activeEx = -1;

  function renderResult(sql, opts) {
    const out = $('#out');
    try {
      const res = runQuery(sql);
      const w = res.q.where;
      let s = `<div class="status"><b>${res.rows.length} ${res.rows.length === 1 ? 'row' : 'rows'}</b> returned from ${res.q.tbl ? '' : ''}${esc(res.tbl.name)}`;
      if (w) s += ` &middot; WHERE kept ${res.afterWhere} of ${res.total} rows`;
      if (res.q.limit !== null && res.afterWhere > res.q.limit) s += ` &middot; LIMIT ${res.q.limit} trimmed it`;
      s += '</div>';
      const showTrace = $('#trace') ? $('#trace').checked : false;
      out.innerHTML = s + renderTable(res.cols, res.rows) + renderReads(res) +
        (w ? `<label class="tog"><input type="checkbox" id="trace" ${showTrace ? 'checked' : ''}> Show why each row passed or failed</label><div id="tracebox"></div>` : '');
      if (w) {
        const box = $('#tracebox'), cb = $('#trace');
        const draw = () => { box.innerHTML = cb.checked ? renderTrace(res) : ''; };
        cb.addEventListener('change', draw); draw();
      }
    } catch (e) {
      if (e instanceof SqlError) out.innerHTML = `<div class="err"><b>Check your query.</b> ${esc(e.message)}</div>`;
      else { out.innerHTML = `<div class="err">Something unexpected went wrong: ${esc(e.message)}</div>`; console.error(e); }
    }
  }
  const run = () => renderResult(ed.value);
  $('#run').addEventListener('click', run);
  $('#reset').addEventListener('click', () => { ed.value = cfg.defaultSql; activeEx = -1; setChips(); $('#note').innerHTML = ''; run(); });
  ed.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
    else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const s = ed.selectionStart; ed.setRangeText('  ', s, ed.selectionEnd, 'end'); }
  });
  function setChips() { document.querySelectorAll('#examples .chip').forEach((c, i) => c.classList.toggle('on', i === activeEx)); }
  $('#examples').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    activeEx = Number(b.dataset.i); const ex = cfg.examples[activeEx];
    ed.value = ex.sql; setChips();
    $('#note').innerHTML = `<div class="note">${esc(ex.note)}</div>`;
    run();
  });
  document.querySelectorAll('.colchip').forEach(b => b.addEventListener('click', () => {
    const s = ed.selectionStart; ed.setRangeText(b.dataset.col, s, ed.selectionEnd, 'end'); ed.focus();
  }));

  /* theme */
  const root = document.documentElement;
  $('#theme').addEventListener('click', () => {
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });

  /* challenges */
  const solved = new Set();
  const prog = () => { $('#prog').innerHTML = `<b>${solved.size}</b> of ${cfg.challenges.length} solved`; };
  $('#chals').innerHTML = cfg.challenges.map((c, i) => `
    <div class="panel chal" data-i="${i}">
      <div class="ttl"><h3>${i + 1}. ${esc(c.title)}</h3><span class="done" hidden>Solved</span></div>
      <p class="q">${esc(c.prompt)}</p>
      <textarea class="ed" spellcheck="false" aria-label="Your answer for challenge ${i + 1}">${esc(c.starter)}</textarea>
      <div class="bar">
        <button class="btn" data-act="check" type="button">Run and check</button>
        <button class="btn ghost" data-act="hint" type="button">Hint</button>
        <button class="btn ghost" data-act="sol" type="button">Show solution</button>
      </div>
      <div class="reveal" data-slot="hint" hidden>${esc(c.hint)}</div>
      <div class="reveal" data-slot="sol" hidden>One way to write it:<pre>${esc(c.solution)}</pre></div>
      <div data-slot="fb"></div>
    </div>`).join('');
  prog();

  function checkChallenge(c, sql) {
    let mine;
    try { mine = runQuery(sql); } catch (e) {
      return { ok: false, msg: e instanceof SqlError ? e.message : 'Something went wrong running that query.', res: null };
    }
    const sol = runQuery(c.solution);
    if (mine.tbl.name !== c.table) return { ok: false, msg: `This one uses the ${c.table} table.`, res: mine };
    const ki = mine.cols.findIndex(x => x.toLowerCase() === c.key);
    if (ki < 0) return { ok: false, msg: `Include ${c.key} in your SELECT so I can compare your rows.`, res: mine };
    const si = sol.cols.findIndex(x => x.toLowerCase() === c.key);
    const a = new Set(mine.rows.map(r => r[ki])), b = new Set(sol.rows.map(r => r[si]));
    const missing = [...b].filter(x => !a.has(x)), extra = [...a].filter(x => !b.has(x));
    if (!missing.length && !extra.length) return { ok: true, msg: `Correct. ${b.size} rows, exactly the ones expected.`, res: mine };
    const parts = [];
    if (missing.length) parts.push(`${missing.length} ${missing.length === 1 ? 'row is' : 'rows are'} missing (for example ${missing.slice(0, 2).join(', ')})`);
    if (extra.length) parts.push(`${extra.length} ${extra.length === 1 ? 'row shouldn\u2019t' : 'rows shouldn\u2019t'} be there (for example ${extra.slice(0, 2).join(', ')})`);
    return { ok: false, msg: 'Not quite: ' + parts.join(', and ') + '.', res: mine };
  }
  $('#chals').addEventListener('click', e => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const card = btn.closest('.chal'); const i = Number(card.dataset.i); const c = cfg.challenges[i];
    const act = btn.dataset.act;
    if (act === 'hint') card.querySelector('[data-slot="hint"]').hidden = false;
    if (act === 'sol') card.querySelector('[data-slot="sol"]').hidden = false;
    if (act === 'check') {
      const r = checkChallenge(c, card.querySelector('textarea').value);
      const fb = card.querySelector('[data-slot="fb"]');
      fb.innerHTML = `<div class="fb ${r.ok ? 'ok' : 'no'}">${esc(r.msg)}</div>` + (r.res ? `<div style="margin-top:10px">${renderTable(r.res.cols, r.res.rows)}</div>` : '');
      if (r.ok) { solved.add(i); card.querySelector('.done').hidden = false; prog(); }
    }
  });
  card_keys();
  function card_keys() {
    $('#chals').addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { const b = e.target.closest('.chal'); if (b) { e.preventDefault(); b.querySelector('[data-act="check"]').click(); } }
      else if (e.key === 'Tab' && !e.shiftKey && e.target.tagName === 'TEXTAREA') { e.preventDefault(); const t = e.target; t.setRangeText('  ', t.selectionStart, t.selectionEnd, 'end'); }
    });
  }
  run();
}

init(CFG);
</script>
</body>
</html>
